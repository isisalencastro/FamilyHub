name: Release Alenfinos Hub

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Upload NSIS installer to Supabase Storage
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          NSIS_FILE="src-tauri/target/release/bundle/nsis/Alenfinos Hub_${VERSION}_x64-setup.exe"
          NSIS_SIG_FILE="${NSIS_FILE}.sig"

          # Upload the installer
          curl -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/storage/v1/object/app-updates/Alenfinos-Hub_${VERSION}_x64-setup.exe" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary "@${NSIS_FILE}"

          # Upload the signature
          curl -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/storage/v1/object/app-updates/Alenfinos-Hub_${VERSION}_x64-setup.exe.sig" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: text/plain" \
            -H "x-upsert: true" \
            --data-binary "@${NSIS_SIG_FILE}"

      - name: Read signature
        id: sig
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          SIG=$(cat "src-tauri/target/release/bundle/nsis/Alenfinos Hub_${VERSION}_x64-setup.exe.sig")
          echo "signature=${SIG}" >> $GITHUB_OUTPUT

      - name: Generate latest.json for Tauri Updater
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DOWNLOAD_URL="${SUPABASE_URL}/storage/v1/object/public/app-updates/Alenfinos-Hub_${VERSION}_x64-setup.exe"
          SIG="${{ steps.sig.outputs.signature }}"

          cat > latest.json << ENDJSON
          {
            "version": "${VERSION}",
            "notes": "Atualização v${VERSION} do Alenfinos Hub",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIG}",
                "url": "${DOWNLOAD_URL}"
              }
            }
          }
          ENDJSON

      - name: Upload latest.json to Supabase Storage
        shell: bash
        run: |
          curl -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/storage/v1/object/app-updates/latest.json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary "@latest.json"

      - name: Notify Supabase app_version table
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          DOWNLOAD_URL="${SUPABASE_URL}/storage/v1/object/public/app-updates/Alenfinos-Hub_${VERSION}_x64-setup.exe"

          curl -X POST \
            "${SUPABASE_URL}/rest/v1/app_version" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"id\": \"current\", \"version\": \"${VERSION}\", \"changelog\": \"Atualização v${VERSION}\", \"download_url\": \"${DOWNLOAD_URL}\"}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Alenfinos Hub v${{ steps.version.outputs.version }}
          body: |
            ## Alenfinos Hub v${{ steps.version.outputs.version }}

            Atualização automática disponível no app.

            ### Download manual
            Baixe o instalador Windows (.exe) dos assets abaixo.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          draft: false
          prerelease: false
